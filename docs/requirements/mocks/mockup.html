<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCTG · 基本設計モック</title><style>
:root{
--color-bg:#ffffff;--color-surface:#f5f5f7;--color-paper:#ffffff;--color-text:#0c0e0f;--color-accent:#5980a6;
--color-divider:color-mix(in srgb,#1d1f20 16%,transparent);--color-hair:color-mix(in srgb,#1d1f20 8%,transparent);
--n100:#f5f5f8;--n200:#e7e7ea;--n300:#d4d4d7;--n400:#b7b7ba;--n500:#6f6f73;--n600:#575759;--n700:#3c3c3e;--n800:#282829;--n900:#2b2b2d;
--a100:#eef6ff;--a200:#d6ebff;--a300:#b5d9fd;--a400:#94bce3;--a500:#749dc4;--a600:#597ea3;--a700:#416180;--a800:#2c455d;--a900:#1d2d3d;
/* status hues: same chroma/lightness family as the steel accent */
--ok:oklch(0.55 0.09 155);--ok-100:oklch(0.95 0.03 155);--ok-800:oklch(0.35 0.07 155);
--warn:oklch(0.62 0.11 70);--warn-100:oklch(0.96 0.035 80);--warn-800:oklch(0.40 0.08 65);
--danger:oklch(0.52 0.15 25);--danger-100:oklch(0.95 0.03 25);--danger-800:oklch(0.36 0.12 25);
--font-body:Meiryo,"メイリオ","Hiragino Kaku Gothic ProN","ヒラギノ角ゴ ProN W3","MS PGothic",sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
--radius-sm:4px;--radius-md:6px;--radius-lg:10px;--shadow-sm:0 1px 2px color-mix(in srgb,#2b2b2d 14%,transparent);--shadow-md:0 3px 10px color-mix(in srgb,#2b2b2d 16%,transparent);--shadow-lg:0 12px 32px color-mix(in srgb,#2b2b2d 22%,transparent);
--nav-width:232px;--shell-h:72px;
--z-sticky:2;--z-nav:3;--z-header:4;--z-pop:5;--z-toast:10;--z-tip:20;
font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--color-text);background:var(--color-bg)}
*,*::before,*::after{box-sizing:border-box}body{margin:0;font-feature-settings:"palt"}
[hidden]{display:none!important}
:focus{outline:none}:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
a{color:var(--a700);text-underline-offset:3px}a:hover{color:var(--a800)}

/* ── shell: light rail with hairline, numbered items, steel indicator ── */
header{position:fixed;top:0;left:0;width:var(--nav-width);height:var(--shell-h);z-index:var(--z-header);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 var(--s8) 0 var(--s4);background:var(--a100);border-right:1px solid var(--a200);border-bottom:1px solid var(--a200)}
header b{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.02em;line-height:1.1}
header b em{font-style:normal;font-weight:400;color:var(--n600)}
.brand-mark{display:grid;place-items:center;width:26px;height:26px;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);background:var(--color-accent);color:#fff;font-weight:700;font-size:13px;letter-spacing:0;flex:none;position:relative}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;width:7px;height:7px;background:linear-gradient(var(--n700),var(--n700)) center/1px 100% no-repeat,linear-gradient(var(--n700),var(--n700)) center/100% 1px no-repeat}
.brand-mark::before{top:-4px;left:-4px}.brand-mark::after{bottom:-4px;right:-4px}
header>span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--n600);padding-left:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-toggle{position:absolute;right:var(--s2);top:50%;transform:translateY(-50%);width:26px;height:26px;padding:0;border:1px solid var(--color-divider);border-radius:var(--radius-sm);background:transparent;color:var(--n700);font-size:14px;line-height:1;cursor:pointer}
.nav-toggle:hover{background:var(--color-surface)}
nav{position:fixed;top:var(--shell-h);bottom:0;left:0;width:var(--nav-width);z-index:var(--z-nav);display:flex;flex-direction:column;gap:2px;padding:var(--s4) var(--s2);overflow-y:auto;background:var(--a100);border-right:1px solid var(--a200);box-shadow:var(--shadow-sm)}
nav a{position:relative;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:var(--radius-md);font-size:13.5px;color:var(--n700);text-decoration:none;line-height:1.35;border-left:2px solid transparent}
nav a:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent);color:var(--color-text)}
nav a:active{background:color-mix(in srgb,var(--color-text) 10%,transparent)}
nav a.active{color:var(--a800);background:var(--a200);border-left-color:var(--color-accent);font-weight:600}
.nav-num{font-family:var(--mono);font-size:11px;color:var(--n500);min-width:20px;letter-spacing:.02em}
nav a.active .nav-num{color:var(--color-accent)}
.nav-tip{display:none}
body.nav-collapsed{--nav-width:60px}
body.nav-collapsed header{padding:0;align-items:center}
body.nav-collapsed header b,body.nav-collapsed header>span{display:none}
body.nav-collapsed .nav-toggle{position:static;transform:none}
body.nav-collapsed nav{overflow:visible;padding:var(--s4) var(--s1)}
body.nav-collapsed nav a{justify-content:center;padding:12px 0}
body.nav-collapsed .nav-num{min-width:0}
body.nav-collapsed .nav-name{display:none}
body.nav-collapsed nav a:hover .nav-tip,body.nav-collapsed nav a:focus-visible .nav-tip{display:block;position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--n900);color:#fff;white-space:nowrap;padding:6px 10px;font-size:12px;z-index:var(--z-tip);pointer-events:none}

main{margin-left:var(--nav-width);padding:var(--s5) var(--s8) var(--s8)}
.banner{display:flex;gap:10px;padding:8px 12px;margin-bottom:var(--s5);border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-paper);box-shadow:var(--shadow-sm);border-left:3px solid var(--color-accent);font-size:12px;line-height:1.6;color:var(--n700)}
footer{padding:var(--s6) 0 0;font-size:11px;color:var(--n500);letter-spacing:.02em}

/* ── type ── */
.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s5);margin:0 0 var(--s5);padding-bottom:var(--s4);border-bottom:1px solid var(--a200)}
.heading>div{min-width:0}
.eyebrow{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent)}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:6px 0 4px}
h2{font-size:15px;font-weight:600;letter-spacing:.01em;margin:0 0 var(--s3);padding-bottom:6px;border-bottom:1px solid var(--a200)}
h3{font-size:14px;font-weight:600;margin:var(--s3) 0 var(--s2)}
p{margin:4px 0 var(--s2);color:var(--n800);font-size:13px;line-height:1.7;text-wrap:pretty}
.small{font-size:12px;color:var(--n700)}
.muted,td.muted{color:var(--n500)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ── blueprint panel: transparent, hairline, + registration marks ── */
.panel{position:relative;padding:var(--s5);margin-bottom:var(--s4);border:1px solid var(--color-divider);border-radius:var(--radius-lg);background:var(--color-paper);box-shadow:var(--shadow-sm);min-width:0}
.panel::before,.panel::after{content:"";position:absolute;width:11px;height:11px;pointer-events:none;background:linear-gradient(currentColor,currentColor) center/1px 100% no-repeat,linear-gradient(currentColor,currentColor) center/100% 1px no-repeat;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.panel::before{top:-6px;left:-6px}.panel::after{bottom:-6px;right:-6px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--s4)}
.meta{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s8);padding:0 0 var(--s4);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--n500)}
.meta strong{display:block;margin-top:3px;font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--color-text)}
.kpis{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s8);padding:var(--s3) var(--s4);margin-bottom:var(--s3);background:var(--a100);border:1px solid var(--a200);border-radius:var(--radius-md);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--n500)}
.kpis>div{white-space:nowrap}.kpis b{display:block;margin:2px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--color-text);font-variant-numeric:tabular-nums}
.note{position:relative;margin:var(--s3) 0;padding:10px 14px;border:1px solid var(--a200);background:var(--a100);border-radius:var(--radius-md);border-left:3px solid var(--color-accent);font-size:12.5px;line-height:1.7;color:var(--n700)}
.note b{color:var(--color-text)}
blockquote{margin:var(--s2) 0;padding:12px 14px;border-radius:var(--radius-md);border-left:3px solid var(--color-accent);background:var(--a100);font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;color:var(--n800)}
.tools{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin:var(--s3) 0}
.head-actions{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;justify-content:flex-end}

/* ── controls ── */
button,select,input,textarea{font:inherit;font-size:13px;color:var(--color-text)}
button,.button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border:1px solid var(--color-divider);border-radius:var(--radius-md);background:transparent;color:var(--color-text);font-weight:500;line-height:1.2;text-decoration:none;cursor:pointer;white-space:nowrap}
button:hover,.button:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
button:active,.button:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary,button.primary{background:var(--color-accent);border-color:var(--color-accent);color:#fff;position:relative;box-shadow:var(--shadow-sm)}
.primary:hover{background:var(--a600)}.primary:active{background:var(--a700)}
.primary::before,.primary::after{content:"";position:absolute;width:9px;height:9px;pointer-events:none;background:linear-gradient(currentColor,currentColor) center/1px 100% no-repeat,linear-gradient(currentColor,currentColor) center/100% 1px no-repeat;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.primary::before{top:-5px;left:-5px}.primary::after{bottom:-5px;right:-5px}
td button{padding:4px 8px;font-size:12px}
label{display:block;font-size:12px;color:var(--n700);margin:var(--s3) 0 5px}
select,textarea,input[type=text]{padding:7px 10px;min-height:34px;border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-surface);max-width:100%;caret-color:var(--color-accent)}
select,textarea{width:100%}
select:hover,textarea:hover,input[type=text]:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
select:focus-visible,textarea:focus-visible,input[type=text]:focus-visible{border-color:var(--color-accent);outline-offset:0}
input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--color-accent);cursor:pointer}
[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}
.case-pick{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap}
.case-pick label{margin:0;white-space:nowrap;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--n500)}
.case-pick select{width:auto;min-height:30px;padding:4px 8px;font-size:12.5px}
.drop{padding:var(--s6);text-align:center;border:1px dashed var(--a400);background:var(--a100);border-radius:var(--radius-md)}
.drop p{margin:6px 0 0;font-size:12px}
details summary{cursor:pointer}

/* ── column filters ── */
.column-filters{display:flex;align-items:flex-end;flex-wrap:wrap;gap:var(--s2) var(--s3);padding:var(--s3) var(--s3);margin:var(--s2) 0;background:var(--a100);border:1px solid var(--a200);border-radius:var(--radius-md)}
.column-filters label{margin:0;min-width:130px;font-size:11px;letter-spacing:.04em;color:var(--n600)}
.column-filters label:first-child{flex:1;min-width:210px}
.column-filters input,.column-filters select{display:block;margin-top:4px;width:100%;height:34px;padding-top:0;padding-bottom:0;background:var(--color-paper)}.column-filters button{background:var(--color-paper)}
.column-filters #clear-filters{height:34px}
.column-filters #filter-count,.column-filters [role=status]{font-family:var(--mono);font-size:11.5px;color:var(--n600);min-width:72px;padding-bottom:9px}

/* ── tables ── */
.scroll{overflow:auto;border:1px solid var(--a200);border-radius:var(--radius-md)}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{text-align:left;padding:10px var(--s2);border-bottom:1px solid var(--color-hair);vertical-align:top}
th{position:sticky;top:0;font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--a800);background:var(--a100);border-bottom:1px solid var(--a300)}
tbody tr:hover{background:color-mix(in srgb,var(--color-accent) 6%,transparent)}
tbody tr:last-child td{border-bottom:0}
td small{display:block;margin-top:3px;font-size:11.5px;color:var(--n600)}
td b{font-weight:600;font-variant-numeric:tabular-nums}
tr.dim{opacity:.5}
tr.row-hl td{background:var(--a100);box-shadow:inset 0 0 0 1px var(--color-accent)}
.summary-cell{white-space:normal;min-width:240px;max-width:340px;line-height:1.6}
#SCR-03 td:first-child,#SCR-03 th:first-child{text-align:center}
#SCR-03 td,#SCR-06 td{vertical-align:top}
#SCR-03 th{white-space:nowrap}
#SCR-03 tr[data-item-row],#SCR-06 tr[data-approve-row]{cursor:pointer}
#SCR-03 tr[data-item-row]:focus-visible,#SCR-06 tr[data-approve-row]:focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px}
select[data-q-status],select[data-q-resolve]{width:auto;min-width:max-content;padding-right:26px}
td:has(select[data-q-status]),td:has(select[data-q-resolve]){min-width:8em}
.column-filters select[data-q-status],.column-filters select[data-q-resolve]{margin-top:4px}
td[data-tone]{font-weight:500}td[data-tone=ok]{color:var(--ok-800)}td[data-tone=warn]{color:var(--warn-800)}td[data-tone=danger]{color:var(--danger-800)}td[data-tone=neutral]{color:var(--n500)}

/* ── pills (status-tinted via data-tone) ── */
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--radius-sm);font-size:11px;letter-spacing:.02em;line-height:1.5;white-space:nowrap;background:var(--n200);color:var(--n800);border:1px solid transparent}
.pill[data-tone=accent]{background:var(--a100);color:var(--a800)}
.pill[data-tone=ok]{background:var(--ok-100);color:var(--ok-800)}
.pill[data-tone=warn]{background:var(--warn-100);color:var(--warn-800)}
.pill[data-tone=danger]{background:var(--danger-100);color:var(--danger-800)}
.pill[data-tone=neutral]{background:transparent;color:var(--n600);border-color:var(--color-divider)}

/* ── progress: 4 segments, steel fill ── */
.prog{display:flex;flex-direction:column;gap:5px;white-space:nowrap}
.prog b{font-weight:600;font-size:12.5px;color:var(--color-text)}
.prog-pips{display:inline-flex;gap:3px;margin:0}
.prog-pips i{display:block;width:22px;height:4px;border-radius:2px;background:var(--n300)}
.prog-pips i.done{background:var(--a400)}
.prog-pips i.cur{background:var(--color-accent)}
td .prog+small{margin-top:5px}

/* ── version popover ── */
.ver{position:relative}
.ver>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--color-divider);border-radius:var(--radius-md);font-size:13px;font-weight:500;white-space:nowrap}
.ver>summary::-webkit-details-marker{display:none}
.ver>summary::after{content:'▾';font-size:10px;color:var(--n600)}.ver[open]>summary::after{content:'▴'}
.ver>summary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.ver-body{position:absolute;right:0;top:calc(100% + 8px);z-index:var(--z-pop);width:min(640px,86vw);padding:var(--s4);text-align:left;background:var(--color-paper);border-radius:var(--radius-lg);border:1px solid var(--color-divider);box-shadow:var(--shadow-lg)}
.ver-body table{white-space:nowrap}.ver-body .tools{margin:var(--s2) 0}

/* ── approval ── */
.approve-wrap{display:flex;gap:var(--s3);align-items:stretch;flex-wrap:wrap;margin-bottom:var(--s2)}
.approve-meta{font-size:11.5px;color:var(--n600);margin:var(--s2) 0 0}
.approve-status{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;padding:10px 14px;border:1px solid var(--a200);border-radius:var(--radius-md);background:var(--a100)}
.approve-status .kpis{display:grid;grid-template-columns:repeat(3,auto);gap:4px var(--s4);align-content:flex-start;padding:0;border:0;margin:0;background:transparent}
.approve-status .kpis div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;white-space:nowrap;line-height:1.4}
.approve-status .kpis b{display:inline;font-size:14px;margin:0}
.approve{display:flex;flex-flow:row nowrap;gap:var(--s3);align-items:stretch;flex:1 1 700px;min-width:0}
.approve-box{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;padding:10px 14px;border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.approve-cap{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--a800);margin-bottom:8px}
.approve-row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.approve-row label{margin:0;font-size:12px;color:var(--n600);white-space:nowrap;flex:0 0 auto}
.approve-row input{width:7em;flex:0 1 auto;min-width:4.5em}
.approve-row #sendoff-reason{width:8em}
.approve-row select{width:7em;flex:0 0 auto}
.approve-row button{flex:0 0 auto}
.approve-hint{font-size:11.5px;color:var(--n600);margin:auto 0 0;padding-top:8px;line-height:1.5}
.approve-lists{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin:var(--s3) 0}
.approve-lists ul{margin:0;padding-left:var(--s4);font-size:12.5px;line-height:1.6}
.approve-lists li{margin:6px 0}.approve-lists li small{display:block;color:var(--n600)}
.approve-lists .panel{margin:0}
.drawer .approve-lists{grid-template-columns:1fr}

/* ── drawer ── */
dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(600px,94vw);height:100dvh;max-height:100dvh;padding:0;border:0;border-left:1px solid var(--color-divider);border-radius:var(--radius-lg) 0 0 var(--radius-lg);background:var(--color-paper);color:var(--color-text);box-shadow:var(--shadow-lg);overflow:auto}
dialog::backdrop{background:color-mix(in srgb,var(--n900) 45%,transparent)}
.drawer{padding:var(--s5) var(--s6)}
.drawer table{white-space:normal}.drawer .summary-cell{min-width:0}
.drawer-head{position:sticky;top:0;z-index:var(--z-sticky);display:flex;justify-content:space-between;align-items:center;margin:calc(-1 * var(--s5)) calc(-1 * var(--s6)) var(--s3);padding:var(--s3) var(--s6);background:var(--a100);border-bottom:1px solid var(--a200)}
.drawer h1{font-size:20px}

/* ── toast ── */
#toast{position:fixed;bottom:var(--s6);left:calc(50% + var(--nav-width)/2);transform:translateX(-50%);z-index:var(--z-toast);max-width:min(90vw,560px);padding:12px 18px;border-radius:var(--radius-md);background:var(--n900);color:#fff;font-size:13px;line-height:1.5;box-shadow:var(--shadow-lg);border-left:3px solid var(--color-accent)}
#toast.is-error{background:var(--danger-800);border-left-color:var(--danger-100)}

@media(max-width:1180px){.approve-row{flex-wrap:wrap}.approve{flex-flow:row wrap}.approve-box,.approve-status{flex:1 1 100%}}
@media(max-width:1000px){:root{--nav-width:190px}.grid{grid-template-columns:1fr}main{padding:var(--s4)}}

 if(!by){warn('先に Item List 確認画面で担当者名を入力してください。');ev.target.checked=!ev.target.checked;return}
 const rid=ev.target.dataset.check,R=rec();
 if(ev.target.checked){R.checked[rid]=true;R.at['check_'+rid]=now()}else{delete R.checked[rid];delete R.at['check_'+rid]}
 details();bindDrawer();toast(`行${rid} を${R.checked[rid]?'照合済みにしました':'未照合に戻しました'}`)});
const fs=$('ed-field');if(fs){const sync=()=>{const q=fs.value==='qty';$('ed-qty-box').hidden=!q;$('ed-text-box').hidden=q};fs.onchange=sync;sync()}
const sv=d.querySelector('[data-edit-save]');if(sv)sv.onclick=()=>{const c=C(),r=c.rows[selected],f=$('ed-field').value,
 label=(EDITABLE.find(x=>x[0]===f)||[])[1]||f,reason=($('ed-reason').value||'').trim(),by=($('ed-by').value||'').trim();
 if(!reason){warn('修正理由を入力してください。');$('ed-reason').setAttribute('aria-invalid','true');$('ed-reason').focus();return}
 if(!by){warn('修正者を入力してください。AIは補完しません。');$('ed-by').setAttribute('aria-invalid','true');$('ed-by').focus();return}
 let val;
 if(f==='qty'){const st=$('ed-qty-state').value;
  if(st==='数値'){const n=($('ed-qty').value||'').trim(),u=($('ed-qty-unit').value||'').trim();
   if(!/^\d+(\.\d+)?$/.test(n)){warn('数量は数値で入力してください。');$('ed-qty').focus();return}
   if(!u){warn('数量を訂正するときは単位が必須です（数値と単位は分離して保持します）。');$('ed-qty-unit').focus();return}
   val=Number(n);
   const uo=cur(r,'unit');if(u!==uo){rec().edits.push({row:r.id,field:'unit',label:'数量単位',old:uo,val:u,reason,by,at:now(),undone:false})}
  }else{val=st}
 }else{val=($('ed-value').value||'').trim();if(!val){warn('新しい値を入力してください。');$('ed-value').focus();return}}
 const old=f==='qty'?cur(r,'qty'):cur(r,f);
 if(String(old)===String(val)){warn('現在の値と同じです。訂正は記録しません。');return}
 rec().staff=rec().staff||by;
 rec().edits.push({row:r.id,field:f,label,old,val,reason,by,at:now(),undone:false});
 if(rec().state!=='draft'){rec().state='staff';rec().at.review=''}
 render();openDrawer('evidence');toast(`行${r.id} ${label} を訂正しました（旧値は履歴に残ります）。`)};
d.querySelectorAll('[data-edit-undo]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.editUndo);rec().edits[n].undone=true;render();openDrawer('evidence');toast('訂正を取り消しました。履歴は残ります。')});}
function closeDrawer(){ $('drawer').close();if(location.hash==='#SCR-04')goto(returnPage);}
function openDrawer(mode,target=''){drawerMode=mode;const c=C();if(mode==='lists'){$('drawer-title').textContent=target?`行 ${target} の変更・判断事項`:'変更・判断事項と未解決事項';$('detail').innerHTML=approveLists(key,target);}else if(mode==='raw'){$('drawer-title').textContent='原表記を併記';$('detail').innerHTML='<h1>原表記と整理後の値</h1><p>元の表記を保ったまま、整理後の値と見比べます。</p>'+c.rows.map(r=>`<article class="panel"><h2>行 ${r.id} · ${e(cur(r,'kind'))}</h2><p>${e(cur(r,'od'))} / ${e(cur(r,'weight'))} / ${e(cur(r,'grade'))} / ${e(cur(r,'connection'))} / ${e(cur(r,'length'))} / ${qtyText(cur(r,'qty'))} ${e(cur(r,'unit'))}</p><blockquote>${e(r.quote)}</blockquote><p class="small">${e(r.where)}</p></article>`).join('');}else{details();}$('drawer').scrollTop=0;if(!$('drawer').open)$('drawer').showModal();bindDrawer();}
$('nav').innerHTML=(()=>{let n=0;return titles.map((t,i)=>{if(i===3)return '';n++;const num=String(n).padStart(2,'0');return `<a href="#${id(i+1)}" aria-label="${num} ${t}"><span class="nav-num">${num}</span><span class="nav-name">${t}</span><span class="nav-tip" aria-hidden="true">${t}</span></a>`;}).join('');})();$('close').onclick=closeDrawer;$('drawer').addEventListener('cancel',ev=>{ev.preventDefault();closeDrawer()});$('detail').onclick=ev=>{if(ev.target.closest('[data-lists-all]')){openDrawer('lists');return;}const evidenceButton=ev.target.closest('[data-evidence]');if(evidenceButton){selected=Number(evidenceButton.dataset.evidence);openDrawer('evidence');return;}if(ev.target.closest('[data-prev]')&&selected>0){selected--;details();bindDrawer();}if(ev.target.closest('[data-next]')&&selected<C().rows.length-1){selected++;details();bindDrawer();}};$('nav-toggle').onclick=()=>{const closed=document.body.classList.toggle('nav-collapsed');$('nav-toggle').textContent=closed?'›':'‹';$('nav-toggle').setAttribute('aria-expanded',String(!closed));$('nav-toggle').setAttribute('aria-label',closed?'ナビゲーションを開く':'ナビゲーションを閉じる');$('nav-toggle').title=closed?'ナビゲーションを開く':'ナビゲーションを閉じる';};window.addEventListener('hashchange',route);render();
</script><script>
// Status color-coding: derive a tone from the label text after each render.
(()=>{const T=[[/対応なし|欠落|上限超過|容量超過|未対応形式/,'danger'],[/対応済み|解決$|^解決|判断済み|照合済み|承認|警告なし|網羅性確認 済/,'ok'],[/択一|TBA|継承候補|P\.S\.|Rev\.|変更採用|要確認|数量未確定|未解決|未対応|対応中|保留|差し戻し|訂正|未照合/,'warn'],[/^除外|Scope/,'neutral'],[/担当者|案件レベル/,'accent']];
const tone=t=>{for(const [re,k] of T)if(re.test(t))return k;return ''};
const apply=root=>{root.querySelectorAll('.pill').forEach(p=>{const k=tone(p.textContent.trim());if(k)p.dataset.tone=k});
 root.querySelectorAll('#SCR-03 tbody td:nth-child(13)').forEach(td=>{const k=tone(td.firstChild&&td.firstChild.textContent||'');if(k)td.dataset.tone=k});};
const mo=new MutationObserver(ms=>{for(const m of ms)if(m.target.id==='pages'||m.target.id==='detail'){apply(document.body);return}});
mo.observe(document.body,{childList:true,subtree:true});apply(document.body);})();
</script></body></html>
