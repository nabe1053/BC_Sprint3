# PostgreSQL 開発環境（ローカルのみ）。
# Docker の用途は DB 起動だけ。アプリのコンテナ化・デプロイには使わない（CLAUDE.md 決定事項）。
services:
  postgres:
    image: postgres:16-alpine
    container_name: octg_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: octg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
